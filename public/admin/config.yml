# Konfigurasi panel admin (Sveltia CMS)
#
# Panel ini dibuka di https://shaku.id/admin/ dan menyimpan perubahan
# langsung sebagai commit ke repo GitHub. Setelah commit masuk, GitHub
# Actions membangun ulang situs secara otomatis.
#
# ============================================================
# WAJIB DIGANTI: baris "repo" di bawah harus diisi nama akun
# GitHub Anda, contoh: budi-nailart/shaku-web
# ============================================================

backend:
  name: github
  repo: jokonoegroho/shaku-web
  branch: main
  # Masuk pakai token GitHub, bukan tombol "Login with GitHub".
  # Sengaja begitu: cara ini tidak butuh server perantara sama sekali.
  auth_methods: [token]
  commit_messages:
    create: 'Tambah konten {{collection}} {{slug}}'
    update: 'Ubah konten {{collection}} {{slug}}'
    delete: 'Hapus konten {{collection}} {{slug}}'
    uploadMedia: 'Tambah foto {{path}}'
    deleteMedia: 'Hapus foto {{path}}'

# Foto diunggah ke folder aslinya supaya tetap diproses (dikecilkan dan
# dikonversi ke WebP) oleh Astro saat build. Jangan diarahkan ke public/.
media_folder: /src/assets/produk
# Jalur yang ditulis ke dalam berkas produk. Sveltia mewajibkan jalur absolut
# atau alias berawalan "@"; alias @assets sudah didaftarkan di astro.config.mjs
# dan tsconfig.json, jadi Astro tetap bisa memproses fotonya.
public_folder: '@assets/produk'

collections:
  - name: banner
    label: Banner Beranda
    description: >-
      Kelola foto slideshow beranda. Banner SHA.KU selalu pertama (3 detik),
      diikuti slide aktif sesuai urutan daftar (masing-masing 6 detik).
    media_folder: /src/assets/banner
    public_folder: '@assets/banner'
    files:
      - name: beranda
        label: Foto dan urutan slideshow
        file: src/data/banner/beranda.json
        fields:
          - label: Banner utama SHA.KU
            name: utama
            widget: object
            hint: Selalu tampil pertama. Tulisan SHA.KU di tengah dipasang otomatis.
            fields:
              - label: Foto desktop
                name: foto
                widget: image
              - label: Foto HP
                name: fotoHp
                widget: image
                required: false
                hint: Opsional. Jika kosong, memakai foto desktop.
          - label: Slide setelah banner utama
            name: slide
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.nama}}'
            hint: Geser urutan item untuk mengatur slideshow. Daftar boleh kosong.
            fields:
              - label: Nama atau deskripsi foto
                name: nama
                widget: string
                hint: Dipakai sebagai deskripsi gambar untuk aksesibilitas.
              - label: Tampilkan slide
                name: aktif
                widget: boolean
                default: true
                hint: Matikan untuk menyembunyikan tanpa menghapus foto.
              - label: Foto desktop
                name: foto
                widget: image
              - label: Foto HP
                name: fotoHp
                widget: image
                required: false
                hint: Opsional. Foto tegak cocok untuk HP. Jika kosong, memakai foto desktop.
              - label: Fokus foto HP - horizontal (%)
                name: fokusHpX
                widget: number
                value_type: int
                min: 0
                max: 100
                default: 50
                hint: 0 kiri, 50 tengah, 100 kanan.
              - label: Fokus foto HP - vertikal (%)
                name: fokusHpY
                widget: number
                value_type: int
                min: 0
                max: 100
                default: 50
                hint: 0 atas, 50 tengah, 100 bawah.

  - name: produk
    label: Produk
    label_singular: Produk
    description: >-
      Setiap produk di sini menjadi satu halaman di katalog. Perubahan baru
      muncul di situs beberapa menit setelah disimpan.
    folder: src/data/produk
    create: true
    extension: md
    format: yaml-frontmatter
    identifier_field: nama
    slug: '{{slug}}'
    summary: '{{nama}} — Rp {{harga}}'
    sortable_fields: [urutan, nama, harga]
    view_groups:
      - label: Bentuk
        field: bentuk
    fields:
      - label: Nama produk
        name: nama
        widget: string
        hint: Dipakai juga untuk alamat halaman. Hindari mengubahnya setelah dipublikasikan.

      - label: Ringkasan singkat
        name: ringkasan
        widget: string
        hint: Satu kalimat, maksimal 160 huruf. Tampil di kartu katalog dan hasil pencarian Google.
        pattern: ['^.{1,160}$', 'Maksimal 160 huruf.']

      - label: Foto produk
        name: foto
        widget: image
        multiple: true
        min: 1
        hint: Foto pertama dipakai sebagai gambar utama di katalog.

      - label: Harga (Rupiah)
        name: harga
        widget: number
        value_type: int
        min: 0
        hint: Tulis angka saja tanpa titik, contoh 85000.

      - label: Harga coret
        name: hargaCoret
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Isi hanya bila sedang diskon. Kosongkan bila tidak.

      - label: Bentuk kuku
        name: bentuk
        widget: select
        options: [almond, coffin, square, stiletto, oval, round]

      - label: Panjang kuku
        name: panjang
        widget: select
        options: [pendek, sedang, panjang]

      - label: Warna
        name: warna
        widget: list
        min: 1
        hint: Dipakai untuk penyaringan katalog. Contoh, merah lalu glossy.

      - label: Jumlah keping per set
        name: jumlahKuku
        widget: number
        value_type: int
        min: 1
        default: 24

      - label: Stok tersedia
        name: tersedia
        widget: boolean
        default: true
        hint: Matikan bila stok habis. Produk tetap tampil tapi tidak bisa dipesan.

      - label: Tampilkan di beranda
        name: unggulan
        widget: boolean
        default: false

      - label: Urutan tampil
        name: urutan
        widget: number
        value_type: int
        default: 100
        hint: Angka lebih kecil tampil lebih dulu di katalog.

      - label: Keterangan lengkap
        name: body
        widget: markdown
        hint: Penjelasan panjang yang tampil di halaman produk, termasuk isi paket.
